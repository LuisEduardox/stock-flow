<div class="max-w-4xl mx-auto p-lg md:p-container-margin">
  <div class="mb-lg">
    <h2 class="font-headline-md text-headline-md text-on-surface">
      {{ isEdit() ? 'Update' : 'Register New' }} Product
    </h2>
    <p class="font-body-md text-body-md text-on-surface-variant mt-sm">
      Enter the precise details below to {{ isEdit() ? 'update the' : 'add a new' }} item to the
      active inventory tracking system.
    </p>
  </div>
  <div
    class="bg-surface-container border border-white/[0.08] rounded-xl p-lg md:p-[32px] shadow-[0_4px_24px_rgba(0,0,0,0.2)]"
  >
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-xl">
      <div class="flex flex-col gap-xs">
        <label class="font-label-uppercase text-label-uppercase text-on-surface-variant" for="name"
          >Product Name</label
        >
        <input
          class="bg-surface border border-outline-variant/30 rounded p-[10px] font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-on-surface-variant/50"
          id="name"
          formControlName="name"
          placeholder="e.g. Lithium Ion Battery Pack"
          type="text"
        />
      </div>
      <div class="flex flex-col gap-xs">
        <label
          class="font-label-uppercase text-label-uppercase text-on-surface-variant"
          for="category"
          >Category</label
        >
        <div class="relative">
          <select
            class="w-full bg-surface border border-outline-variant/30 rounded p-[10px] font-body-md text-body-md text-on-surface appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors cursor-pointer"
            id="category"
            formControlName="category"
          >
            <option value="" disabled>Select category...</option>
            <option value="electronics">Electronics</option>
            <option value="hardware">Hardware</option>
            <option value="consumables">Consumables</option>
            <option value="raw-materials">Raw Materials</option>
          </select>
          <span
            class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none"
            >expand_more</span
          >
        </div>
      </div>
      <div class="flex flex-col gap-xs">
        <label
          class="font-label-uppercase text-label-uppercase text-on-surface-variant"
          for="quantity"
          >Initial Quantity</label
        >
        <input
          class="bg-surface border border-outline-variant/30 rounded p-[10px] font-data-mono text-data-mono text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-on-surface-variant/50"
          id="quantity"
          formControlName="quantity"
          placeholder="0"
          type="number"
        />
      </div>
      <div class="flex flex-col gap-xs">
        <label class="font-label-uppercase text-label-uppercase text-on-surface-variant" for="price"
          >Unit Price (USD)</label
        >
        <div class="relative">
          <span
            class="absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant font-data-mono"
            >$</span
          >
          <input
            class="w-full bg-surface border border-outline-variant/30 rounded p-[10px] pl-[28px] font-data-mono text-data-mono text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-on-surface-variant/50"
            id="price"
            formControlName="price"
            placeholder="0.00"
            step="0.01"
            type="number"
          />
        </div>
      </div>
      <div class="md:col-span-2 flex flex-col gap-xs">
        <label class="font-label-uppercase text-label-uppercase text-on-surface-variant"
          >Product Image URL</label
        >
        <input
          class="bg-surface border border-outline-variant/30 rounded p-[10px] font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-on-surface-variant/50"
          formControlName="imageUrl"
          placeholder="https://example.com/image.jpg"
          type="text"
        />
      </div>
      <div class="md:col-span-2 flex flex-col gap-xs">
        <label
          class="font-label-uppercase text-label-uppercase text-on-surface-variant"
          for="description"
          >Detailed Description</label
        >
        <textarea
          class="bg-surface border border-outline-variant/30 rounded p-[10px] font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-on-surface-variant/50 resize-none"
          id="description"
          formControlName="description"
          placeholder="Enter specifications, internal notes, or technical details..."
          rows="4"
        ></textarea>
      </div>
      <div class="md:col-span-2 flex justify-end gap-md mt-sm pt-lg border-t border-white/5">
        <button
          class="border border-primary text-primary font-label-uppercase text-label-uppercase px-lg py-[10px] rounded hover:bg-primary/10 transition-colors duration-200"
          type="button"
          routerLink="/dashboard"
        >
          Cancel
        </button>
        <button
          class="bg-primary text-on-primary font-label-uppercase text-label-uppercase px-lg py-[10px] rounded shadow-[0_0_15px_rgba(192,193,255,0.15)] hover:shadow-[0_0_20px_rgba(192,193,255,0.3)] hover:brightness-110 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
          type="submit"
          [disabled]="productForm.invalid"
        >
          {{ isEdit() ? 'Update' : 'Save' }} Product
        </button>
      </div>
    </form>
  </div>
</div>
